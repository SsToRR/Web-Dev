<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Counter</h1>
    </header>

    <main>
        <p class="counter" id="count">0</p>
        <div class="buttons">
            <button onclick="increase()" class="plus" id="plus">+</button>
            <button onclick="decrease()" class="minus" id="minus">-</button>
            <button onclick="reset()" class="reset" id="reset">reset</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
